<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Kelola Produk | Velora Café</title>
  <link rel="icon" href="images/logo-mark.png">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Poppins:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --b: #3e2415;
      --b2: #6b4129;
      --a: #b8793f;
      --c: #f5ece0;
      --l: #e6d3b8;
      --t: #2b1a10
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: var(--c);
      color: var(--t);
      line-height: 1.6
    }

    h1,
    h2,
    h3,
    .logo b {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .wrap {
      max-width: 1150px;
      margin: auto;
      padding: 0 20px
    }

    .sec {
      padding: 52px 0
    }

    .nav {
      background: var(--b);
      color: var(--c);
      position: sticky;
      top: 0;
      z-index: 20
    }

    .nav .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 66px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      color: var(--c)
    }

    .logo svg {
      color: var(--l)
    }

    .links {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .links a {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px
    }

    .links a:hover,
    .links a.on {
      background: var(--b2)
    }

    .cnt {
      background: var(--a);
      border-radius: 10px;
      padding: 0 7px;
      font-size: 12px;
      margin-left: 3px
    }

    .burger {
      display: none;
      background: none;
      border: 0;
      color: var(--c);
      font-size: 26px
    }

    .ph svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .ph img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .hero {
      background: linear-gradient(120deg, rgba(40, 20, 10, .82), rgba(40, 20, 10, .35)), url(images/banner.jpg) center/cover, repeating-linear-gradient(45deg, #6b4129 0 12px, #5a3520 12px 24px);
      color: #fff;
      padding: 90px 0
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1.1;
      max-width: 640px
    }

    .hero p {
      max-width: 520px;
      margin: 18px 0 26px;
      color: var(--l)
    }

    .btn {
      display: inline-block;
      background: var(--b);
      color: #fff;
      border: 2px solid var(--b);
      padding: 9px 20px;
      border-radius: 30px;
      cursor: pointer;
      font: 600 14px Poppins, sans-serif
    }

    .btn:hover {
      background: var(--a);
      border-color: var(--a)
    }

    .btn.o {
      background: none;
      color: var(--b)
    }

    .hero .btn.o {
      color: #fff;
      border-color: #fff
    }

    .btn.r {
      background: #a33;
      border-color: #a33
    }

    .btn.sm {
      padding: 4px 12px;
      font-size: 12px
    }

    h2.t {
      font-size: 32px;
      margin-bottom: 6px
    }

    .sub {
      color: var(--b2);
      margin-bottom: 26px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 22px
    }

    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(62, 36, 21, .08)
    }

    .ph {
      height: 155px;
      display: grid;
      place-items: center;
      font-size: 62px;
      background: linear-gradient(135deg, var(--l), #cf9b66);
      position: relative
    }

    .heart {
      position: absolute;
      top: 10px;
      right: 10px;
      border: 0;
      background: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 17px;
      color: #bbb;
      cursor: pointer
    }

    .heart.on {
      color: #d33
    }

    .pb {
      padding: 16px
    }

    .pb p {
      font-size: 13px;
      color: #6b5a4e;
      margin: 6px 0
    }

    .pb small {
      color: var(--a);
      font-weight: 600
    }

    .price {
      font: 600 20px Fraunces, serif;
      color: var(--b);
      margin: 6px 0
    }

    .opt {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0
    }

    label {
      font-size: 12px;
      font-weight: 600;
      display: block
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #d8c4a8;
      border-radius: 9px;
      font: 14px Poppins, sans-serif;
      background: #fff;
      margin-top: 3px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px
    }

    .chip {
      font: 14px Poppins, sans-serif;
      border: 1px solid var(--b);
      background: none;
      border-radius: 20px;
      padding: 5px 15px;
      cursor: pointer
    }

    .chip.on {
      background: var(--b);
      color: #fff
    }

    .box1 {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      margin: 44px auto;
      box-shadow: 0 4px 18px rgba(62, 36, 21, .12)
    }

    .box1 h2 {
      margin-bottom: 14px
    }

    .box1 label {
      margin-top: 12px
    }

    .tabs {
      display: flex;
      gap: 8px
    }

    .tabs button {
      flex: 1
    }

    .err {
      color: #b22;
      font-size: 13px;
      margin-top: 8px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 34px;
      align-items: center
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .line {
      display: flex;
      gap: 14px;
      align-items: center;
      background: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px
    }

    .line .e {
      font-size: 34px
    }

    .line .g {
      flex: 1
    }

    .tw {
      overflow-x: auto;
      background: #fff;
      border-radius: 12px;
      margin-top: 14px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    th,
    td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
      vertical-align: top
    }

    th {
      background: var(--l)
    }

    .bd {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      background: var(--l);
      font-weight: 600
    }

    .bd.Selesai {
      background: #cfe8cf
    }

    .bd.Dibatalkan {
      background: #f2cccc
    }

    .bd.Diproses {
      background: #ffe8b3
    }

    .foot {
      background: var(--b);
      color: var(--l);
      padding: 20px 0 52px;
      margin-top: 28px;
      font-size: 12.5px;
      line-height: 1.5
    }

    .foot .grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px
    }

    .foot h4 {
      color: #fff;
      font-size: 13px;
      margin-bottom: 2px
    }

    .foot svg {
      width: 18px;
      height: 18px;
      vertical-align: -3px
    }

    .ob {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #fff;
      color: #2b6b2b
    }

    .ob i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2fb344;
      display: inline-block
    }

    .ob.off {
      color: #a33
    }

    .ob.off i {
      background: #d33
    }

    .wa {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      background: #25d366;
      color: #fff;
      border-radius: 50px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
      display: flex;
      align-items: center;
      gap: 6px
    }

    .wa .ic {
      stroke: #fff
    }

    .sold {
      position: absolute;
      left: 10px;
      top: 10px;
      background: #a33;
      color: #fff;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 12px;
      font-weight: 600;
      z-index: 2
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      background: #888;
      border-color: #888
    }

    .rw {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      margin: 4px 0
    }

    .vc {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border: 2px dashed var(--a);
      border-radius: 12px;
      padding: 10px 12px;
      margin: 8px 0;
      background: #fffaf3
    }

    .vc.on {
      background: #fff0dc;
      border-style: solid
    }

    .vc.off {
      opacity: .6;
      border-color: #bbb
    }

    .vbn {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center
    }

    .vchip {
      border: 2px dashed var(--a);
      background: #fffaf3;
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer
    }

    .vchip:hover {
      background: #fff0dc
    }

    .act {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center
    }

    .act .btn {
      margin: 0;
      white-space: nowrap
    }

    .tw td {
      vertical-align: middle
    }

    .th {
      display: inline-block;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--l), #cf9b66);
      flex: none;
      vertical-align: middle
    }

    .th img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .th svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .pn {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .lg {
      height: 50px;
      width: auto;
      display: block
    }

    .hero .wrap {
      position: relative
    }

    .hero-logo {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      height: 300px;
      opacity: .92
    }

    .hero .btn:not(.o) {
      background: var(--a);
      border-color: var(--a)
    }

    .hero .btn:not(.o):hover {
      background: #fff;
      color: var(--b);
      border-color: #fff
    }

    @media(max-width:800px) {
      .hero-logo {
        display: none
      }
    }

    .foot .lg {
      height: 30px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 4px
    }

    .side .lg {
      height: 38px
    }

    .foot small {
      display: block;
      text-align: center;
      margin-top: 16px;
      opacity: .7
    }

    .foot .grid>div {
      padding-bottom: 6px
    }

    .foot .ob {
      display: flex;
      width: fit-content;
      max-width: 100%;
      margin: 8px 0 2px;
      font-size: 11.5px;
      padding: 2px 10px;
      line-height: 1.5
    }

    .foot .ob+br,
    .foot br+.ob {
      margin-top: 6px
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--b);
      color: #fff;
      padding: 11px 22px;
      border-radius: 30px;
      z-index: 99
    }

    .adm {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100vh
    }

    .side {
      background: var(--b);
      color: var(--l);
      padding: 20px 14px
    }

    .side .logo {
      margin-bottom: 24px;
      font-size: 20px
    }

    .side a {
      display: block;
      padding: 9px 14px;
      border-radius: 10px;
      margin-bottom: 4px
    }

    .side a:hover,
    .side a.on {
      background: var(--b2);
      color: #fff
    }

    .am {
      padding: 26px
    }

    .am h1 {
      margin-bottom: 18px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 22px
    }

    .st {
      background: #fff;
      border-radius: 14px;
      padding: 18px
    }

    .st b {
      font: 600 26px Fraunces, serif;
      display: block;
      color: var(--b)
    }

    .bars {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      height: 180px;
      background: #fff;
      border-radius: 14px;
      padding: 16px
    }

    .bars div {
      flex: 1;
      text-align: center;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%
    }

    .bars i {
      background: var(--a);
      border-radius: 6px 6px 0 0;
      display: block;
      min-height: 2px
    }

    .mod {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: grid;
      place-items: center;
      z-index: 50;
      padding: 16px
    }

    .mod .box {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      max-height: 92vh;
      overflow-y: auto
    }

    .mod label {
      margin-top: 10px
    }

    .mod .row {
      margin-top: 16px
    }

    .rate {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0 2px;
      margin: 4px 0
    }

    .rate small,
    .rate a {
      white-space: nowrap
    }

    .rate b {
      margin-left: 6px;
      font-size: 13px
    }

    .rate small {
      margin-left: 3px;
      color: #8a7767 !important;
      font-weight: 400 !important
    }

    .star {
      color: #ddd;
      font-size: 17px
    }

    .rl {
      font-size: 12px;
      margin-left: 8px;
      text-decoration: underline;
      color: var(--b2)
    }

    .rp {
      display: inline-flex;
      flex-direction: row-reverse;
      margin-top: 6px
    }

    .rp input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px
    }

    .rp label {
      font-size: 36px;
      color: #ddd;
      cursor: pointer;
      margin: 0;
      padding: 0 2px;
      line-height: 1
    }

    .rp input:checked~label,
    .rp label:hover,
    .rp label:hover~label {
      color: #f5a623
    }

    .star.on {
      color: #f5a623
    }

    .ic {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -3px;
      flex: none
    }

    .iw {
      position: relative
    }

    .iw .ic {
      position: absolute;
      left: 13px;
      top: 50%;
      margin-top: -7px;
      color: var(--b2)
    }

    .iw input {
      padding-left: 42px
    }

    .nav .ic {
      vertical-align: -4px;
      margin-right: 3px
    }

    [hidden] {
      display: none !important
    }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .seg button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0;
      padding: 9px
    }

    .collage {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 12px
    }

    .collage .ct {
      height: 165px;
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(62, 36, 21, .25);
      border: 4px solid #fff;
      overflow: hidden
    }

    .ct.t0 {
      transform: rotate(-3deg)
    }

    .ct.t1 {
      transform: rotate(3deg);
      margin-top: 26px
    }

    .ct.t2 {
      transform: rotate(2deg)
    }

    .ct.t3 {
      transform: rotate(-2deg);
      margin-top: 26px
    }

    .bdg {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: var(--b);
      color: #fff;
      border-radius: 50%;
      width: 112px;
      height: 112px;
      display: grid;
      align-content: center;
      text-align: center;
      font-size: 19px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
      border: 4px solid #fff;
      line-height: 1.2
    }

    .bdg small {
      font-size: 10px;
      color: var(--l)
    }

    @media(max-width:800px) {
      .wa {
        padding: 12px;
        border-radius: 50%;
        right: 14px;
        bottom: 14px
      }

      .wa .ic {
        width: 24px;
        height: 24px
      }

      .wa .wt {
        display: none
      }

      .foot {
        padding-bottom: 76px
      }

      .burger {
        display: block
      }

      .links {
        display: none;
        position: absolute;
        top: 66px;
        left: 0;
        right: 0;
        background: var(--b);
        flex-direction: column;
        padding: 12px
      }

      .links.open {
        display: flex
      }

      .two {
        grid-template-columns: 1fr
      }

      .adm {
        grid-template-columns: minmax(0, 1fr)
      }

      .am {
        min-width: 0;
        padding: 16px
      }

      .side a {
        padding: 7px 12px;
        font-size: 14px
      }

      .side {
        display: flex;
        flex-wrap: wrap;
        gap: 4px
      }

      .side .logo {
        width: 100%;
        margin: 0
      }
    }

    @media print {
      .wa {
        display: none !important
      }

      body {
        background: #fff
      }

      .side,
      .nav,
      .foot,
      .noprint {
        display: none !important
      }

      .adm {
        display: block
      }
    }
  </style>
</head>

<body>
  <div class="adm">
    <aside class="side"><a class="logo" href="admin-dashboard.html"><b>Velora Admin</b></a><a
        href="admin-dashboard.html" class="">Dashboard</a><a href="admin-produk.html" class="on">Produk</a><a
        href="admin-kategori.html" class="">Kategori</a><a href="admin-pesanan.html" class="">Pesanan</a><a
        href="admin-pelanggan.html" class="">Pelanggan</a><a href="admin-laporan.html" class="">Laporan</a><a

        href="index.html">Lihat Website</a><a href="#" onclick="logout()">Keluar</a></aside>
    <div class="am">
      <h1>Kelola Produk</h1>
      <div id="app"></div>
    </div>
  </div>
  <script>
    const $ = (s, e = document) => e.querySelector(s), $$ = (s, e = document) => [...e.querySelectorAll(s)];
    const G = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v } catch { return d } }, S = (k, v) => localStorage.setItem(k, JSON.stringify(v));
    const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
    const LOGO_SVG = '<svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18h26v10a10 10 0 0 1-10 10h-6A10 10 0 0 1 8 28z"/><path d="M34 21h4a5 5 0 0 1 0 10h-5"/><path d="M16 5c-2 3 2 4 0 8M24 5c-2 3 2 4 0 8"/></svg>';
    const LOGO = '<img class=lg src="images/logo-mark-light.png" alt="Velora Café" onerror="this.outerHTML=LOGO_SVG">';
    const NM = ['Velora Signature', 'Americano', 'Café Latte', 'Spanish Latte', 'Caramel Macchiato', 'Matcha Latte', 'Chocolate', 'Taro Latte', 'Red Velvet', 'Strawberry Milk', 'Lemon Tea', 'Peach Tea', 'Lychee Tea', 'Thai Tea', 'Chicken Katsu Rice', 'Chicken Teriyaki Rice', 'Chicken Burger', 'Spaghetti Bolognese', 'Chicken Sandwich', 'French Fries', 'Chicken Nugget', 'Butter Croissant', 'Chocolate Cake', 'Brownies', 'Coffee + French Fries', 'Matcha Latte + Brownies', 'Chicken Katsu + Lemon Tea']; const pimg = p => p.img || (NM.includes(p.name) ? 'images/produk-' + (NM.indexOf(p.name) + 1) + '.jpg' : '');

    const rtg = p => { const V = G('reviews', []).filter(r => r.pid == p.id), v = V.map(r => r.stars), b = 4.7 + (p.id % 3) * .1, n = 76 + (p.id % 9) * 11, t = n + v.length, q = G('orders', []).filter(o => o.status != 'Dibatalkan').reduce((s, o) => s + o.items.filter(i => i.pid == p.id).reduce((a, i) => a + i.qty, 0), 0); return { a: Math.min(5, Math.max(4.7, (b * n + v.reduce((x, y) => x + y, 0)) / t)), n: n + q, rc: V.length } };

        if (e.target.dataset.w != null) { let w = G(wishK(), []); w = w.includes(p.id) ? w.filter(i => i != p.id) : [...w, p.id]; S(wishK(), w); e.target.classList.toggle('on'); toast('Wishlist diperbarui') }
        if (e.target.dataset.a != null) { if (p.soldout) { toast('Maaf, menu ini sedang habis'); return } const D = !!$('[data-s]', c), s = D ? $('[data-s]', c).value : 'Regular', t = D ? $('[data-t]', c).value : '-', g = D ? $('[data-g]', c).value : '-', q = Math.max(1, +$('[data-q]', c).value || 1); let k = G(cartK(), []); const f = k.find(i => i.pid == p.id && i.size == s && i.temp == t && i.sugar == g); f ? f.qty += q : k.push({ pid: p.id, name: p.name, emoji: p.emoji, size: s, temp: t, sugar: g, qty: q, price: p.price + SZ[s] }); S(cartK(), k); nav(); toast(p.name + ' masuk keranjang') }
      }

    document.addEventListener('change', e => { if (e.target.id != 'up' || !e.target.files[0]) return; const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 700 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); const f = e.target.form.elements.img; f.value = c.toDataURL('image/jpeg', .8); $('#pv').src = f.value; $('#pv').style.display = 'block' }; im.src = r.result }; r.readAsDataURL(e.target.files[0]) });
